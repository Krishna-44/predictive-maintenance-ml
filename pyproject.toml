[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "predmaint"
version = "0.1.0"
description = "Predictive maintenance: failure-risk classification, remaining-useful-life regression and anomaly detection from machine telemetry, served with FastAPI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krishna Goyal" }]
keywords = ["predictive-maintenance", "machine-learning", "time-series", "anomaly-detection", "iot", "fastapi"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "httpx2", "ruff>=0.5"]

[project.scripts]
predmaint = "predmaint.cli:main"

[project.urls]
Repository = "https://github.com/Krishna-44/predictive-maintenance-ml"

[tool.hatch.build.targets.wheel]
packages = ["src/predmaint"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
